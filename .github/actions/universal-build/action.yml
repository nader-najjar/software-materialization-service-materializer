name: Universal Build
description: Build the checked-out source repository with Universal Build.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

    - name: Cache Nix Store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'universal-build') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

    - name: Build
      run: ./universal-build build
      shell: bash
