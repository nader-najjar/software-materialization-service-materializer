name: "Materialize"
run-name: "Materialize"
"on":
  push:
    branches:
    - "execution"
concurrency:
  group: "materialize"
  queue: "single"
  cancel-in-progress: false
permissions:
  contents: "read"
jobs:
  build:
    name: "Build ${{ matrix.repositoryName }} (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
        - repositoryName: "nader-najjar/software-materialization-service-algorithm"
          commitSHA: "9af49361c2ed3a071069851728930f6e6d07ced4"
          buildSystem: "universal"
          platform: "aarch64-linux"
          runner: "ubuntu-24.04-arm"
    runs-on: "${{ matrix.runner }}"
    steps:
    - name: "Reject Manual Retries"
      uses: "$/.github/actions/reject-manual-retries"
    - name: "Reject Unsupported Build Systems"
      if: "matrix.buildSystem != 'universal'"
      run: "echo \"::error::Unsupported build system: $BUILD_SYSTEM\"; exit 1"
      env:
        BUILD_SYSTEM: "${{ matrix.buildSystem }}"
    - name: "Set Release Name"
      run: "repo='${{ matrix.repositoryName }}'; echo \"RELEASE_NAME=${repo/\\//@}-${{ matrix.platform }}-${{ matrix.commitSHA }}\" >> \"$GITHUB_ENV\""
    - name: "Set Repository Owner"
      run: "echo \"REPOSITORY_OWNER=${REPOSITORY_NAME%%/*}\" >> \"$GITHUB_ENV\""
      env:
        REPOSITORY_NAME: "${{ matrix.repositoryName }}"
    - name: "Create Repository Token"
      id: "create-repository-token"
      uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510"
      with:
        client-id: "${{ vars.MATERIALIZATION_PUBLISH_CLIENT_ID }}"
        private-key: "${{ secrets.MATERIALIZATION_PUBLISH_PRIVATE_KEY }}"
        owner: "${{ env.REPOSITORY_OWNER }}"
        repositories: "${{ matrix.repositoryName }}"
        permission-contents: "write"
    - name: "Find Release Artifact"
      id: "find-release-artifact"
      uses: "$/.github/actions/find-release-artifact"
      with:
        repository-name: "${{ matrix.repositoryName }}"
        release-name: "${{ env.RELEASE_NAME }}"
        github-token: "${{ steps.create-repository-token.outputs.token }}"
    - name: "Check Out ${{ matrix.repositoryName }}"
      if: "steps.find-release-artifact.outputs.found != 'true'"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      with:
        repository: "${{ matrix.repositoryName }}"
        ref: "${{ matrix.commitSHA }}"
        persist-credentials: "false"
        token: "${{ steps.create-repository-token.outputs.token }}"
    - name: "Build ${{ matrix.repositoryName }}"
      if: "steps.find-release-artifact.outputs.found != 'true' && matrix.buildSystem == 'universal'"
      uses: "$/.github/actions/universal-build"
    - name: "Publish Release Artifact"
      if: "steps.find-release-artifact.outputs.found != 'true'"
      uses: "$/.github/actions/publish-release-artifact"
      with:
        repository-name: "${{ matrix.repositoryName }}"
        commit-sha: "${{ matrix.commitSHA }}"
        release-name: "${{ env.RELEASE_NAME }}"
        github-token: "${{ steps.create-repository-token.outputs.token }}"
